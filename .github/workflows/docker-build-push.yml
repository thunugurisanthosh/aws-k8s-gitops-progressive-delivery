name: Build and Push Image
on: { push: { branches: [main] } }
permissions: { contents: read }
env: { AWS_REGION: ap-south-1, ECR_REPOSITORY: gitops-platform }
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build and push
        env: { REGISTRY: '${{ steps.login-ecr.outputs.registry }}' }
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:${{ github.sha }} ./app
          docker push $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
